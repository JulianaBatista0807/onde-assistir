openapi: 3.0.3
info:
  title: Onde Assistir API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '201':
          description: Created
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresAt]
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }
  /api/users/me:
    get:
      summary: Current user (requires JWT)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/titles/search:
    get:
      summary: Search movies and series (requires JWT)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
        - in: query
          name: type
          schema:
            type: string
            enum: [movie, series]
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  total: { type: integer }
                  region: { type: string, example: BR }
                  source: { type: string, example: tmdb }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        tmdbId: { type: integer }
                        title: { type: string }
                        originalTitle: { type: string }
                        type: { type: string, enum: [movie, series] }
                        year: { type: integer }
                        synopsis: { type: string }
                        posterUrl: { type: string }
                        providers:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              type: { type: string, enum: [subscription, rent, buy] }
                              logoUrl: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

